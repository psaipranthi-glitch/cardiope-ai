services:
  - type: web
    name: cardiope-ai
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
